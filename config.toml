theme = "duckquill"
title = "ECE 4160: Fast Robots"
description = "Lab documentation for ECE 4160 Fast Robots at Cornell — building an autonomous RC car with the Artemis Nano, time-of-flight sensing, PID and orientation control, Kalman filtering, mapping, Bayes localization, and path planning."
base_url = "https://shaostassen.github.io/ShaoFastRobots"


compile_sass = true
minify_html = true
generate_feeds = true

feed_filenames = ["rss.xml", "atom.xml"]
build_search_index = true
author = "Shao Stassen"

default_language = "en"

taxonomies = [{ name = "tags", feed = true }]

[markdown]
# highlight_code = true
# math = true
# render_html = true
# highlight_theme = "css"
# highlight_themes_css = [
#	{ theme = "solarized-dark", filename = "syntax-theme-dark.css" },
# 	{ theme = "solarized-light", filename = "syntax-theme-light.css" }
# ]
# smart_punctuation = true
# bottom_footnotes = true

[markdown.highlighting]
theme = "github-light"
style = "inline"

[search]
# index_format = "elasticlunr_json"
index_format = "fuse_json"

[extra]

# default_theme = "dark"
katex = true
math = true

favicon = "/favicon.svg"
accent_color = "#0095ff"
accent_color_dark = "#48d4ff"
fix_contrast_dark = true
bundled_fonts = true

# Docs-layout stylesheet, loaded after the theme's style.css so it wins the cascade.
styles = ["docs.css", "lab.css"]
scripts = ["docs-nav.js", "lab.js"]

# Used by partials/breadcrumbs.html for the "Edit on GitHub" link.
repo_url = "https://github.com/shaostassen/ShaoFastRobots"
edit_path = "blob/main/content"

show_copy_button = true
# Whether to show estimated read time in posts. Off: this is documentation, not a blog.
show_reading_time = false

# Whether to show a share button in article's quick actions.
show_share_button = false

# Whether to show the backlinks button for linked articles in the article's quick actions
show_backlinks = true


# Custom separator used across the theme.
# separator = "•"
# Custom separator used in title tag and posts metadata.
# title_separator = "-"


[extra.nav]
# Whether to show the manual theme switcher in the nav
show_theme_switcher = true


# The sidebar carries the full lab tree, so the top nav stays flat.
links = [
	{ url = "@/labs/_index.md", name = "Lab Write-Ups" },
]


[extra.footer]
# Social links in the footer.
# Whether to show "© Title, YEAR"
show_copyright = false
# Whether to show "Powered by Zola and Duckquill"
show_powered_by = false
# Whether to show link to website source
show_source = false
# Custom copyright text
#
# copyright = "© *Aperture* **Science** ~~Innovators~~, `1972`"

[extra.debug]
# Display outlines around all elements for debugging purposes
layout = false
# Don't load any styles for debugging purposes
no_styles = false
